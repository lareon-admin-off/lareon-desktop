<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lareon</title>
<link rel="stylesheet" href="theme.css"><script src="theme.js"></script>
<style>
html,body{height:100%;overflow:hidden}body{background:var(--solid);display:flex;flex-direction:column;border:1px solid var(--line2);border-radius:14px;position:relative;-webkit-app-region:drag}
body:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--grad);border-radius:14px 14px 0 0}
.hd{display:flex;align-items:center;gap:10px;padding:16px 16px 4px}.hd img{width:26px;height:26px}.hd b{font-size:16px;font-weight:600}
p.s{color:var(--fg2);font-size:13px;padding:0 16px 10px}
#l{flex:1;overflow:auto;padding:0 10px;-webkit-app-region:no-drag}
.e{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:12px;cursor:pointer;transition:background .15s}.e:hover{background:var(--hover)}
.e input{margin-top:3px;width:17px;height:17px;accent-color:var(--orange);flex:none}
.d{flex:none;width:46px;text-align:center;border-radius:10px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line);padding:4px 0}.d small{display:block;font:500 10px var(--mono);text-transform:uppercase;color:var(--orange)}.d b{font-size:18px;font-weight:600}
.e .t{flex:1;min-width:0}.e .t b{display:block;font-weight:500;font-size:14px}.e .t span{display:block;color:var(--fg2);font-size:12.5px}
.ft{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:12px 14px 14px;border-top:1px solid var(--line);-webkit-app-region:no-drag}
#msg{flex:1;font-size:13px;color:var(--fg3)}#msg.ok{color:var(--green)}#msg.bad{color:var(--red)}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:8px 14px;font-size:13px;color:var(--fg)}.btn.pri{border:0;background:var(--grad);color:#fff;font-weight:500}.btn:disabled{opacity:.6}
</style></head><body>
<div class="hd"><img src="../build/art/dusk-icon.svg" alt=""><b data-i="iv.t"></b></div><p class="s" id="s"></p>
<div id="l"></div>
<div class="ft"><span id="msg"></span><button class="btn" id="no" data-i="iv.no"></button><button class="btn pri" id="go" data-i="iv.add"></button></div>
<script src="i18n-more.js"></script><script src="i18n-apps.js"></script><script src="i18n.js"></script>
<script>
var $ = function (i) { return document.getElementById(i); }, t = function (k, v) { return i18n.t(k, v); }, E = [], done = false;
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function tm(v) { if (!v) return t('allday'); var p = v.split(':'); return new Date(2000, 0, 1, +p[0], +p[1] || 0).toLocaleTimeString(i18n.lang, { hour: 'numeric', minute: '2-digit' }); }
function paint() {
  $('s').textContent = t(E.length === 1 ? 'iv.one' : 'iv.many', { n: E.length }); $('msg').textContent = ''; $('msg').className = ''; done = false; $('go').textContent = t('iv.add'); $('go').disabled = false;
  $('l').innerHTML = E.map(function (e, i) { var d = new Date(e.date + 'T12:00:00'); return '<label class="e"><input type="checkbox" checked data-i="' + i + '"><span class="d"><small>' + esc(d.toLocaleDateString(i18n.lang, { month: 'short' })) + '</small><b>' + d.getDate() + '</b></span><span class="t"><b>' + esc(e.title) + '</b><span>' + esc(d.toLocaleDateString(i18n.lang, { weekday: 'long' })) + ' · ' + esc(tm(e.start)) + (e.end ? ' – ' + esc(tm(e.end)) : '') + (e.where ? ' · ' + esc(e.where) : '') + '</span></span></label>'; }).join('');
}
lareon.onInviteEvents(function (ev) { E = ev || []; paint(); });
$('go').onclick = function () {
  if (done) return lareon.inviteClose(true);
  var picks = [].slice.call(document.querySelectorAll('#l input:checked')).map(function (x) { return +x.getAttribute('data-i'); }); if (!picks.length) return;
  $('go').disabled = true; $('msg').textContent = '…';
  lareon.inviteAdd(picks).then(function (r) {
    $('go').disabled = false;
    if (r && r.added) { done = true; $('msg').className = 'ok'; $('msg').textContent = t(r.added === 1 ? 'iv.done1' : 'iv.donen', { n: r.added }); $('go').textContent = t('open.dusk'); }
    else { $('msg').className = 'bad'; $('msg').textContent = (r && r.error) || t('net.fail'); }
  });
};
$('no').onclick = function () { lareon.inviteClose(false); };
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') lareon.inviteClose(false); });
lareon.info().then(function (r) { i18n.set(r.lang || i18n.guess(r.locale), true); if (E.length) paint(); });
</script></body></html>

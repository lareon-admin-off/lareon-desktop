<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lareon</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="vendor/katex/katex.min.css"><link rel="stylesheet" href="md.css"><script src="theme.js"></script>
<style>
body{background:var(--bg)}
/* title bar: the tabs are the title bar, the window buttons sit inside it */
.bar{direction:ltr;position:fixed;left:0;right:0;top:0;height:44px;display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;-webkit-app-region:drag;background:var(--bar);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);z-index:5;border-bottom:1px solid var(--line)}
.mac .bar{padding-left:86px}
.bar{padding-right:calc(100vw - env(titlebar-area-x,0px) - env(titlebar-area-width,100vw) + 8px)}
.bar button{-webkit-app-region:no-drag}
.brand{width:22px;height:22px;margin-right:4px;flex:none}
nav{display:flex;gap:2px;align-items:center;position:relative}
.ind{position:absolute;top:0;bottom:0;left:0;border-radius:8px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line2);transition:transform .4s var(--ease),width .4s var(--ease),opacity .2s;pointer-events:none}
nav,.kb,.acct{flex:none;white-space:nowrap}.bar.tight #an,.bar.tight .kb span{display:none}.bar.tight .acct{padding:3px}
.sp{flex:1}
.kb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg3);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 10px;transition:border-color .2s,color .2s}
.kb:hover{border-color:var(--line2);color:var(--fg2)}.kb kbd{font:500 11px var(--mono);color:var(--fg3)}
.ib{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;background:none;border:0;color:var(--fg2);transition:background .2s,color .2s}.ib:hover{background:var(--hover);color:var(--fg)}.ib svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.acct{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--fg2);background:none;border:1px solid transparent;border-radius:999px;padding:3px 12px 3px 4px;transition:background .2s,border-color .2s}
.acct:hover,.acct[aria-selected=true]{background:var(--panel);border-color:var(--line);color:var(--fg)}
.av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#ff7c1f,#a35cf5);color:#fff;font-weight:600;font-size:13px;display:grid;place-items:center}
.av.off{background:var(--line2);color:var(--fg2)}
.load{position:fixed;left:var(--rail);right:0;top:43px;height:2px;z-index:6;overflow:hidden;opacity:0;transition:opacity .25s}
.load.on{opacity:1}.load i{position:absolute;top:0;bottom:0;width:35%;background:linear-gradient(90deg,transparent,#ff7c1f,#a35cf5,transparent);animation:ld 1.1s ease-in-out infinite}
@keyframes ld{from{left:-35%}to{left:100%}}
/* page */
#home{position:fixed;left:var(--rail);right:0;top:44px;bottom:0;overflow:auto;z-index:1}
#home::-webkit-scrollbar{width:10px}#home::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px;border:2px solid transparent;background-clip:padding-box}
.wrap{max-width:960px;margin:0 auto;padding:48px 32px 64px}
.rise{animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.mono{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg3)}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
h1{font-size:clamp(28px,4.4vw,42px);line-height:1.08;letter-spacing:-.04em;font-weight:600}
.sub{color:var(--fg2);margin-top:4px}
.note{background:rgba(255,68,102,.1);border:1px solid rgba(255,68,102,.4);color:var(--fg);border-radius:10px;padding:10px 14px;margin:0 0 18px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;min-width:0;backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);box-shadow:0 18px 50px -34px rgba(0,0,0,.6)}
.card h2{font-size:15px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.c-today{grid-column:span 7}.c-mail{grid-column:span 5}.c-apps{grid-column:span 12}.c-acct{grid-column:span 12}
@media(max-width:860px){.c-today,.c-mail{grid-column:span 12}}
.link{background:none;border:0;color:var(--orange);font-size:13px;padding:0}.link:hover{text-decoration:underline}
.sec{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);margin:14px 0 8px}.sec:first-of-type{margin-top:0}
.ev{display:flex;gap:12px;align-items:center;padding:8px 10px;border-radius:9px;background:var(--panel2);margin-bottom:6px;border-left:3px solid var(--violet);animation:rise .5s var(--ease) both}
.ev.orange{border-color:var(--orange)}.ev.pink,.ev.red{border-color:#ff4f7a}.ev.green{border-color:var(--green)}.ev.blue{border-color:#4aa8ff}
.ev em{font:500 12px var(--mono);font-style:normal;color:var(--fg3);min-width:52px}
.empty{color:var(--fg3);font-size:14px;padding:6px 2px 8px}
.task{display:flex;align-items:center;gap:11px;padding:7px 4px;border-radius:8px;transition:background .15s,opacity .3s,transform .3s;animation:rise .5s var(--ease) both}
.task:hover{background:var(--hover)}.task.gone{opacity:0;transform:translateX(16px)}
.ck{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);background:none;flex:none;display:grid;place-items:center;transition:background .2s,border-color .2s}
.ck:hover{border-color:var(--orange)}.task.done .ck{background:var(--green);border-color:var(--green)}
.ck svg{width:11px;height:11px;stroke:#0b0a10;stroke-width:3;fill:none;opacity:0;transition:opacity .2s}.task.done .ck svg{opacity:1}
.task.done .tt{color:var(--fg3);text-decoration:line-through}
.tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.due{font:500 11px var(--mono);color:var(--fg3)}.due.late{color:var(--red)}
.add{display:flex;gap:8px;margin-top:10px;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:2px 2px 2px 12px;transition:border-color .15s,box-shadow .2s}
.add:focus-within{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,124,31,.15)}
.add input{flex:1;min-width:0;font:inherit;font-size:14px;color:var(--fg);background:none;border:0;outline:0;padding:8px 0;-webkit-user-select:text;user-select:text}
.add button{border:0;border-radius:8px;background:var(--panel2);color:var(--fg2);padding:0 14px;font-size:13px;transition:background .2s,color .2s}.add button:hover{background:var(--orange);color:#fff}
.mail{display:flex;flex-direction:column;gap:2px}
.mrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 10px;border-radius:9px;transition:background .15s;animation:rise .5s var(--ease) both;background:none;border:0;text-align:left;width:100%}
.mrow:hover{background:var(--hover)}
.mrow b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mrow time{font:500 11px var(--mono);color:var(--fg3)}
.mrow span{grid-column:1/-1;color:var(--fg2);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{font-size:36px;font-weight:600;letter-spacing:-.04em;line-height:1}.big small{font-size:14px;font-weight:400;color:var(--fg2);letter-spacing:0;margin-left:8px}
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.app{display:flex;align-items:center;gap:14px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px;transition:transform .3s var(--ease),border-color .2s,box-shadow .3s}
.app:hover{transform:translateY(-4px);border-color:var(--line2);box-shadow:0 18px 34px -20px rgba(163,92,245,.7)}
.app img{width:40px;height:40px;flex:none;transition:transform .4s var(--ease)}.app:hover img{transform:scale(1.12) rotate(-5deg)}
.app b{display:block;font-weight:600}.app small{color:var(--fg2);font-size:13px}
.acct-row{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.acct-row .who{flex:1;min-width:200px}
.who b{font-size:16px}.who small{display:block;color:var(--fg2)}
.bar2{height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden;width:200px}.bar2 i{display:block;height:100%;width:2%;background:linear-gradient(90deg,#ff7c1f,#a35cf5);transition:width .9s var(--ease)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:7px 14px;font-size:13px;color:var(--fg);transition:background .2s,border-color .2s,transform .12s}.btn:hover{border-color:var(--line2);background:var(--hover)}.btn:active{transform:scale(.97)}
.btn.pri{border:0;color:#fff;background:var(--grad)}.btn.pri:hover{filter:brightness(1.08)}
.foot{margin-top:22px;color:var(--fg3);font-size:12px;font-family:var(--mono)}
.sk{border-radius:8px;background:linear-gradient(90deg,var(--panel2),var(--hover),var(--panel2));background-size:200% 100%;animation:sk 1.3s linear infinite;height:36px;margin-bottom:6px}
@keyframes sk{to{background-position:-200% 0}}
.center{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px 20px 60px}.center .note{max-width:392px;width:100%;text-align:center}
/* opening splash */
#opening{position:fixed;left:var(--rail);right:0;top:44px;bottom:0;display:grid;place-items:center;background:var(--bg);z-index:3;animation:fade .25s both}
#opening div{display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--fg2)}
#opening img{width:56px;height:56px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12);opacity:.75}}@keyframes fade{from{opacity:0}}
/* palette */
#pal{position:fixed;inset:0;z-index:20;display:grid;justify-items:center;align-items:start;padding-top:14vh;background:rgba(10,8,16,.45);backdrop-filter:blur(8px);animation:fade .18s both}
#pal .box{width:min(520px,calc(100vw - 32px));background:var(--solid);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;animation:rise .28s var(--ease) both}
#pal input{width:100%;font:inherit;font-size:16px;color:var(--fg);background:none;border:0;border-bottom:1px solid var(--line);outline:0;padding:16px 18px;-webkit-user-select:text;user-select:text}
#pal ul{list-style:none;max-height:300px;overflow:auto;padding:6px}
#pal li{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:9px;cursor:pointer;color:var(--fg2)}
#pal li[aria-selected=true]{background:var(--panel2);color:var(--fg)}

/* chip, banner, toast */
.chip{display:none;align-items:center;gap:6px;font-size:12px;color:var(--fg);background:rgba(255,68,102,.14);border:1px solid rgba(255,68,102,.45);border-radius:999px;padding:3px 10px;-webkit-app-region:no-drag}
.chip.on{display:flex;animation:fade .3s both}.chip i{width:7px;height:7px;border-radius:50%;background:var(--red)}
#ban{position:fixed;left:50%;top:54px;transform:translate(-50%,-14px);opacity:0;pointer-events:none;z-index:7;background:var(--solid);border:1px solid rgba(255,68,102,.5);color:var(--fg);border-radius:12px;padding:9px 16px;font-size:14px;box-shadow:var(--shadow);transition:opacity .35s var(--ease),transform .45s var(--ease);max-width:calc(100vw - 32px)}
#ban.on{opacity:1;transform:translate(-50%,0)}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);opacity:0;pointer-events:none;z-index:30;background:var(--solid);border:1px solid var(--line2);color:var(--fg);border-radius:12px;padding:10px 18px;font-size:14px;box-shadow:var(--shadow);transition:opacity .35s var(--ease),transform .45s var(--ease)}
#toast.on{opacity:1;transform:translate(-50%,0)}#toast.bad{border-color:rgba(255,68,102,.55)}
.lerr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.lerr span{flex:1;min-width:180px}
/* settings */
#set{position:fixed;left:var(--rail);right:0;top:44px;bottom:0;overflow:auto;z-index:4;background:var(--bg);animation:fade .3s both}
#set .wrap{max-width:680px}
.sg{margin-bottom:18px}.sg h3{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);margin:0 0 8px 4px}
.sg .card{padding:4px 16px}
.sr{display:flex;align-items:center;gap:16px;padding:13px 0;border-top:1px solid var(--line)}.sr:first-child{border-top:0}
.sr .l{flex:1;min-width:0}.sr .l b{font-weight:500;display:block}.sr .l small{display:block;color:var(--fg2);font-size:13px;margin-top:2px}
.sw{width:42px;height:25px;border-radius:13px;border:0;background:var(--line2);position:relative;flex:none;transition:background .3s var(--ease)}
.sw i{position:absolute;left:3px;top:3px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:transform .35s var(--ease)}
.sw[aria-checked=true]{background:var(--grad)}.sw[aria-checked=true] i{transform:translateX(17px)}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:2px;flex:none}
.seg button{border:0;background:none;color:var(--fg2);font-size:13px;padding:5px 14px;border-radius:8px;transition:background .25s,color .25s}
.seg button[aria-checked=true]{background:var(--solid);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.sel{font:inherit;font-size:13px;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 10px;outline:0;max-width:200px}
.sel:focus{border-color:var(--orange)}
.ib svg.fl{width:22px;height:16px;stroke:none}.lgsel{display:flex;align-items:center;gap:9px}.sk2{font:500 12px var(--mono);color:var(--fg2)}
/* focus */
.c-focus{grid-column:span 12}
.c-notes{grid-column:span 12}
#tzp{position:fixed;inset:0;z-index:55;display:grid;place-items:center;padding:24px;background:rgba(8,6,14,.55);backdrop-filter:blur(8px);opacity:0;transition:opacity .25s var(--ease)}
#tzp.on{opacity:1}#tzp.out{opacity:0}
.tz-box{width:min(980px,100%);max-height:100%;overflow:auto;background:var(--solid);border:1px solid var(--line2);border-radius:22px;box-shadow:var(--shadow);padding:20px 22px;transform:translateY(10px) scale(.985);transition:transform .35s var(--ease)}#tzp.on .tz-box{transform:none}
.tz-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.tz-hd h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0}.tz-hd p{margin:4px 0 0;color:var(--fg2);font-size:13.5px}
.tz-x{font-size:24px;line-height:1;color:var(--fg2);background:none;border:0;border-radius:10px;padding:4px 10px;cursor:pointer}.tz-x:hover{background:var(--hover)}
.tz-sr{position:relative;margin:14px 0 12px}.tz-sr input{width:100%;font:inherit;font-size:15px;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 14px;outline:0;-webkit-user-select:text;user-select:text}.tz-sr input:focus{border-color:var(--violet)}
.tz-sr ul{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:3;list-style:none;margin:0;padding:6px;background:var(--solid);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow)}.tz-sr li{padding:9px 12px;border-radius:9px;cursor:pointer;font-size:14px}.tz-sr li:hover{background:var(--hover)}.tz-sr li.no{color:var(--fg3);cursor:default}
.tz-map{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#0e0c18}
.tz-map svg{display:block;width:100%;height:auto;cursor:crosshair}
.tz-map .land{fill:#2c2840}.tz-map .sea{fill:#0e0c18;stroke:#0e0c18;stroke-width:.3}
.tz-map .bd{fill:#a9b8ff;transition:opacity .2s}.tz-map .hb{fill:#ff9a4d;opacity:.22;pointer-events:none;transition:x .35s var(--ease)}.tz-map .bd:hover{opacity:.13!important}
.tz-map .night{fill:#05040b;opacity:.38;pointer-events:none}
.tz-map .bl{font:600 5px var(--mono);fill:#bdb6e6;text-anchor:middle;pointer-events:none}
.tz-map .ct{cursor:pointer}.tz-map .ct .dt{fill:#8fb8ff;stroke:#0e0c18;stroke-width:.6}.tz-map .ct:hover .dt{fill:#fff}
.tz-map .lars .dt{fill:#ff8a33;stroke:#ffe2c9;stroke-width:.8}.tz-map .pulse{fill:#ff8a33;opacity:.35;animation:tzp 2s ease-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes tzp{from{transform:scale(.4);opacity:.6}to{transform:scale(1.6);opacity:0}}
.tz-map .lt{font:800 5.2px var(--sans);fill:#ffb27a;text-anchor:middle;paint-order:stroke;stroke:#0e0c18;stroke-width:1.4px;pointer-events:none}
.tz-map .ring{fill:none;stroke:#fff;stroke-width:.9;animation:tzr .4s var(--ease) both;transform-box:fill-box;transform-origin:center}@keyframes tzr{from{transform:scale(2);opacity:0}}
.tz-tip{position:absolute;transform:translate(-50%,-100%);background:var(--solid);color:var(--fg);border:1px solid var(--line2);border-radius:8px;padding:4px 9px;font-size:12.5px;white-space:nowrap;pointer-events:none;box-shadow:var(--shadow)}
.tz-ft{display:flex;align-items:center;gap:10px;margin-top:14px}.tz-cur{flex:1;display:flex;align-items:center;gap:12px;min-width:0}.tz-cur i{width:12px;height:12px;border-radius:50%;background:#8fb8ff;flex:none}.tz-cur.lars i{background:linear-gradient(135deg,#ff8a33,#c26bff);box-shadow:0 0 0 5px rgba(255,138,51,.18)}
.tz-cur b{display:block;font-size:16px}.tz-cur span{display:block;font-size:13px;color:var(--fg2)}
.tz-ft .btn:disabled{opacity:.45;cursor:default}
#l2{position:fixed;inset:0;z-index:60;display:grid;place-items:center;overflow:auto;background:#0d0a16;color:#fff;opacity:0;transition:opacity .45s var(--ease);text-shadow:none;--fg:#fff}
#l2.on{opacity:1}#l2.out{opacity:0;pointer-events:none;transform:scale(1.02);transition:opacity .4s var(--ease),transform .4s var(--ease)}
.wn-bg{position:fixed;inset:0;overflow:hidden;pointer-events:none}.wn-bg i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;opacity:.55;will-change:transform;animation:wnf 18s ease-in-out infinite alternate}
.wn-bg i:nth-child(1){background:radial-gradient(circle,#ff7a2f,rgba(255,122,47,0) 65%);left:-20vmax;top:-25vmax}.wn-bg i:nth-child(2){background:radial-gradient(circle,#b14cff,rgba(177,76,255,0) 65%);right:-22vmax;top:-10vmax;animation-delay:-6s}.wn-bg i:nth-child(3){background:radial-gradient(circle,#ff4f8b,rgba(255,79,139,0) 65%);left:20%;bottom:-35vmax;opacity:.35;animation-delay:-11s}
@keyframes wnf{to{transform:translate(6vmax,4vmax) scale(1.15)}}
.wn-in{position:relative;width:min(1080px,92vw);padding:48px 0 40px;text-align:center;visibility:hidden}
#l2.go .wn-in{visibility:visible}#l2:not(.go) .wn-in *{animation-play-state:paused}
/* the big moment: the Lareon mark lands, light bursts, "Lareon 2.0" rises, then the page takes over */
.wn-intro{position:fixed;inset:0;display:grid;place-items:center;align-content:center;gap:26px;z-index:2;cursor:pointer;transition:opacity .7s var(--ease),transform .9s var(--ease)}
#l2.go .wn-intro{opacity:0;transform:scale(1.25);pointer-events:none;visibility:hidden;transition:opacity .7s var(--ease),transform .9s var(--ease),visibility 0s .9s}
.wn-logo{position:relative;width:min(300px,40vmin);aspect-ratio:1;animation:wnl 1.5s cubic-bezier(.16,1.3,.3,1) .15s both}
.wn-logo:before{content:"";position:absolute;inset:-35%;border-radius:50%;background:radial-gradient(circle,rgba(255,170,90,.75),rgba(194,107,255,.35) 45%,transparent 70%);filter:blur(20px);animation:wng 2.4s ease-out .35s both}
.wn-logo img{position:relative;width:100%;height:100%;filter:drop-shadow(0 20px 60px rgba(255,120,60,.55))}
@keyframes wnl{0%{opacity:0;transform:scale(.2) rotate(-25deg);filter:blur(12px)}60%{opacity:1;filter:none}100%{transform:none}}
@keyframes wng{0%{opacity:0;transform:scale(.3)}35%{opacity:1;transform:scale(1.25)}100%{opacity:.6;transform:scale(1)}}
.wn-rays{position:absolute;width:150vmax;height:150vmax;background:repeating-conic-gradient(from 0deg,rgba(255,190,130,.10) 0 4deg,transparent 4deg 16deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%);animation:wnr 2.6s ease-out .45s both,wns 40s linear infinite;will-change:transform}
#l2.go .wn-rays,#l2.go .wn-logo:before{animation:none;display:none}

.wn-c small{color:#a9a3c4;font-size:12px}.wn-c kbd{font:600 11.5px var(--mono);color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:1px 6px}
.wn-ft{display:flex;gap:10px;justify-content:center;margin-top:30px;animation:lx-in .6s var(--ease) .9s both}

#dz{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(10,8,18,.5);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .2s var(--ease)}

#dz.on .dz-b{transform:none}#dz b{font-size:22px;font-weight:700}#dz span{color:var(--fg3);font-size:13px}.c-notes h2{display:flex;align-items:center;gap:10px}.c-notes h2 .link{margin-left:auto}

#nta{display:block;width:100%;min-height:120px;max-height:340px;resize:vertical;font:inherit;line-height:1.6;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:0;-webkit-user-select:text;user-select:text}
#nta:focus{border-color:var(--violet);box-shadow:0 0 0 3px color-mix(in srgb,var(--violet) 22%,transparent)}
#pl .ans{display:flex;align-items:baseline;gap:12px;color:var(--fg)}#pl .ans b{font-size:20px;font-weight:700}#pl .ans small{color:var(--fg3);margin-left:auto;font-size:12px}
.fo{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.fo .big{min-width:130px;font-variant-numeric:tabular-nums;font-family:var(--mono);font-weight:500;font-size:34px}

.fbar{height:4px;border-radius:2px;background:var(--line);margin-top:12px;overflow:hidden}.fbar i{display:block;height:100%;width:0;background:var(--grad);transition:width 1s linear}
.wn{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(10,8,16,.5);backdrop-filter:blur(10px);animation:fade .35s both;padding:20px}
.wn .box{width:min(520px,100%);max-height:calc(100vh - 60px);overflow:auto;background:var(--solid);border:1px solid var(--line2);border-radius:20px;padding:28px 28px 22px;box-shadow:var(--shadow);animation:rise .6s var(--ease) both}
.wn h2{font-size:26px;letter-spacing:-.03em;font-weight:600}.wn .vv{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);margin:4px 0 18px}
.wn li{list-style:none;padding:11px 0;border-top:1px solid var(--line)}.wn li b{display:block;font-weight:600}.wn li span{color:var(--fg2);font-size:14px}
.wn .btn{margin-top:18px;width:100%;padding:11px}
.bd{margin-left:7px;font:500 11px var(--mono);background:var(--orange);color:#fff;border-radius:999px;padding:1px 6px}
.mrow{position:relative;cursor:pointer}.mtb{position:absolute;right:6px;bottom:6px;opacity:0;font-size:12px;border:1px solid var(--line2);background:var(--solid);color:var(--fg);border-radius:999px;padding:2px 10px;transition:opacity .2s}.mrow:hover .mtb,.mtb:focus{opacity:1}
.c-brief{grid-column:span 12}.c-brief .brief>p{font-size:16px;margin-bottom:.4em}.c-brief .brief h4{margin-top:.4em;color:var(--orange)}.c-brief .brief ul{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:8px;margin:0 0 .5em}.c-brief .brief li{padding:6px 12px;margin:0;border-radius:8px;background:var(--hover)}.c-brief .empty{padding:0}
#pl .pg{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);padding:8px 12px 2px;cursor:default}

:root{--rail:68px}
/* the apps sidebar */
#rail{position:fixed;left:0;top:44px;bottom:0;width:var(--rail);z-index:5;display:flex;flex-direction:column;align-items:stretch;padding:10px 10px 10px;gap:4px;background:var(--bar);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-right:1px solid var(--line);transition:width .35s var(--ease)}
#rlist{display:flex;flex-direction:column;gap:4px;overflow-y:auto;overflow-x:hidden;flex:1;min-height:0;margin:0 -10px;padding:2px 10px}
#rlist::-webkit-scrollbar{width:0}
.ri{position:relative;display:flex;align-items:center;gap:12px;height:46px;border:0;border-radius:13px;background:none;color:var(--fg2);padding:0 0 0 11px;text-align:left;flex:none;transition:background .2s,color .2s,transform .25s var(--ease)}
.ri:hover{background:var(--hover);color:var(--fg)}.ri:active{transform:scale(.95)}
.ri img,.ri svg.ic{width:26px;height:26px;flex:none;transition:transform .4s var(--ease)}.ri:hover img{transform:scale(1.1) rotate(-4deg)}
.ri svg.ic{stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;width:22px;height:22px;margin:0 2px}
.ri .rn{font-size:14px;font-weight:500;white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none}
body.wide .ri .rn{opacity:1}
.ri[aria-current=true]{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.ri[aria-current=true]:before{content:"";position:absolute;left:-10px;top:11px;bottom:11px;width:3px;border-radius:0 3px 3px 0;background:var(--grad)}
.ri.pair:after{content:"";position:absolute;right:5px;bottom:6px;width:6px;height:6px;border-radius:50%;background:var(--violet);box-shadow:0 0 0 2px var(--bar)}
.ri .bd{position:absolute;left:30px;top:5px;margin:0;font-size:10px;padding:0 5px;line-height:16px;min-width:16px;text-align:center;box-shadow:0 0 0 2px var(--bar)}
.ri.drag{opacity:.35}.ri.over{box-shadow:inset 0 2px 0 var(--orange)}
.rsep{height:1px;background:var(--line);margin:4px 6px;flex:none}
.rbot{display:flex;flex-direction:column;gap:4px;flex:none;padding-top:6px;border-top:1px solid var(--line)}
.rbot .ri{height:40px}.rbot .ri[aria-pressed=true]{color:var(--orange)}
/* the title area: which app you're in, back / forward / reload */
.ttl{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px;color:var(--fg2);-webkit-app-region:drag}
.ttl img{width:18px;height:18px;flex:none}.ttl b{color:var(--fg);font-weight:600;white-space:nowrap}
.ttl .pill{display:flex;align-items:center;gap:7px;padding:3px 10px 3px 6px;border-radius:999px;background:var(--panel);border:1px solid var(--line);-webkit-app-region:no-drag}
.ttl .pill.on{border-color:var(--line2);background:var(--panel2)}
.ttl button{-webkit-app-region:no-drag}
.navb{display:flex;gap:2px;margin-left:6px}.navb .ib{width:28px;height:28px}.navb .ib:disabled{opacity:.3;cursor:default;background:none}
/* the line between two apps in split view */
#divider{position:fixed;top:44px;bottom:0;width:8px;z-index:6;cursor:col-resize;display:none;align-items:center;justify-content:center;-webkit-app-region:no-drag}
#divider.on{display:flex}#divider i{width:4px;height:44px;border-radius:2px;background:var(--line2);transition:background .2s,height .25s var(--ease)}
#divider:hover i,#divider.drag i{background:var(--orange);height:72px}
/* wallpaper picker */
.walls{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;padding:14px 0}
.wt{position:relative;border:0;background:none;padding:0;text-align:left;border-radius:12px}
.wt .pv{position:relative;display:block;height:78px;border-radius:12px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line);transition:transform .3s var(--ease),box-shadow .2s}
.wt:hover .pv{transform:translateY(-2px)}.wt[aria-checked=true] .pv{box-shadow:0 0 0 2px var(--orange),0 10px 24px -12px rgba(255,124,31,.7)}
.wt span.n{display:block;font-size:13px;color:var(--fg2);margin:6px 2px 0}.wt[aria-checked=true] span.n{color:var(--fg);font-weight:500}
.phs{display:flex;gap:6px;padding-bottom:12px}.phs .wt .pv{height:52px}
.c-hidden{display:none!important}.c-today.solo,.c-mail.solo{grid-column:span 12}

/* New and the activity bell */
.ib.nw{width:auto;padding:0 11px 0 8px;gap:5px;display:flex;align-items:center;font-size:13px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:9px;height:30px}
.ib.nw:hover{border-color:var(--line2)}.ib.nw svg{width:15px;height:15px}
#bell{position:relative}#bell i{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 2px var(--bar);display:none}#bell.dot i{display:block}
#bell.dl svg{stroke:var(--orange)}
/* time-of-day chooser */
.phw{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 14px}.phw button{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--fg2);display:flex;align-items:center;gap:7px;transition:border-color .2s,color .2s,background .2s}
.phw button i{width:12px;height:12px;border-radius:50%;flex:none}.phw button[aria-checked=true]{border-color:var(--orange);color:var(--fg);background:var(--solid)}
.tm{display:flex;align-items:center;gap:6px}.tm .sel{max-width:96px}
/* the lock screen */
#lock{position:fixed;inset:0;z-index:80;display:grid;place-items:center;-webkit-app-region:drag}
#lock .lk{position:relative;z-index:1;width:min(340px,calc(100vw - 40px));text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 26px 24px;border-radius:22px;background:var(--panel);border:1px solid var(--line2);backdrop-filter:blur(26px) saturate(1.4);-webkit-backdrop-filter:blur(26px) saturate(1.4);box-shadow:var(--shadow);-webkit-app-region:no-drag;animation:rise .6s var(--ease) both}
#lock .lk img{width:58px;height:58px;filter:drop-shadow(0 10px 24px rgba(163,92,245,.45))}
#lock h2{font-size:22px;letter-spacing:-.02em;font-weight:600}#lock p{color:var(--fg2);font-size:14px;margin-top:-8px}
#lock input{width:100%;text-align:center;font:600 26px var(--mono);letter-spacing:.5em;padding:10px 0 10px .5em;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:12px;outline:0;-webkit-user-select:text;user-select:text}
#lock input:focus{border-color:var(--orange);box-shadow:0 0 0 3px color-mix(in srgb,var(--orange) 22%,transparent)}
#lock .err{color:var(--red);font-size:13px;min-height:18px;margin-top:-6px}
#lock.shake .lk{animation:shake .4s}@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#lock .btn{width:100%;padding:10px}
body.locked #home,body.locked #rail,body.locked #set,body.locked #opening,body.locked #divider,body.locked .bar>*:not(.brand){visibility:hidden!important}
.pinf{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pinf input{width:110px;font:500 14px var(--mono);letter-spacing:.2em;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:9px;padding:6px 10px;outline:0;-webkit-user-select:text;user-select:text}.pinf input:focus{border-color:var(--orange)}

/* Home, redesigned */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}

.qa button:hover{transform:translateY(-2px);border-color:var(--line2);background:var(--panel2)}.qa img{width:22px;height:22px}
.card{border-radius:20px;padding:20px 20px 18px}
.card h2{font-size:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--fg2);font-family:var(--mono)}
.card h2 .link{font-family:var(--sans);letter-spacing:0;text-transform:none;font-size:13px}
.bt{display:flex;align-items:center;gap:8px}.bt img{width:18px;height:18px}
/* up next: a timeline */
#today .sec{display:none}
.ev{display:grid;grid-template-columns:70px 1fr;gap:0 14px;align-items:center;background:none;border:0;padding:9px 6px 9px 0;border-radius:0;margin:0;position:relative}
.ev em{text-align:right;font-size:12.5px;color:var(--fg2)}
.ev .tt{position:relative;padding-left:18px;font-size:15px}
.ev .tt:before{content:"";position:absolute;left:0;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:var(--violet);box-shadow:0 0 0 3px color-mix(in srgb,var(--violet) 22%,transparent)}
.ev.orange .tt:before{background:var(--orange);box-shadow:0 0 0 3px color-mix(in srgb,var(--orange) 22%,transparent)}.ev.green .tt:before{background:var(--green)}.ev.pink .tt:before,.ev.red .tt:before{background:#ff4f7a}.ev.blue .tt:before{background:#4aa8ff}

.tkh{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);margin:14px 0 4px}
/* inbox: people first */
.big{font-size:44px;font-weight:300;letter-spacing:-.04em}.big small{font-size:14px}
.mrow{grid-template-columns:auto 1fr auto;gap:0 12px;align-items:center;padding:10px 8px}
.mrow .avt{grid-row:1/3;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:600;font-size:14px;color:#fff}

.c-across{grid-column:span 12;padding-bottom:14px}
.acr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}@media(max-width:900px){.acr{grid-template-columns:repeat(2,1fr)}}
.at{display:flex;align-items:center;gap:12px;text-align:left;border:0;background:var(--panel2);border-radius:14px;padding:12px;color:var(--fg);min-width:0;transition:transform .25s var(--ease),background .2s;box-shadow:inset 0 0 0 1px var(--line)}

.at .dt{width:8px;height:8px;border-radius:50%;background:var(--orange);flex:none}

.spot{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:40px 28px 56px}
.sp-top{text-align:center}

.sp-clock small{font-size:.22em;font-weight:400;letter-spacing:0;margin-left:10px;color:var(--fg2)}

.sp-wc{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px;min-height:30px}
.sp-wc span{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--fg2);background:color-mix(in srgb,var(--panel) 70%,transparent);border:1px solid var(--line);border-radius:999px;padding:5px 12px;backdrop-filter:blur(12px);animation:lx-in .4s var(--ease) both}
.sp-wc b{color:var(--fg);font-weight:700;font-variant-numeric:tabular-nums}.sp-wc .lrt{border-color:color-mix(in srgb,var(--orange) 45%,var(--line))}
.sp-wc .lrt i{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--violet))}

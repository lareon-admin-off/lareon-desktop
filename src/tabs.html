<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lareon</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css"><script src="theme.js"></script>
<style>
body{background:var(--bg)}
/* title bar: the tabs are the title bar, the window buttons sit inside it */
.bar{direction:ltr;position:fixed;left:0;right:0;top:0;height:44px;display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;-webkit-app-region:drag;background:var(--bar);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);z-index:5;border-bottom:1px solid var(--line)}
.mac .bar{padding-left:86px}
.bar{padding-right:calc(100vw - env(titlebar-area-x,0px) - env(titlebar-area-width,100vw) + 8px)}
.bar button{-webkit-app-region:no-drag}
.brand{width:22px;height:22px;margin-right:4px;flex:none}
nav{display:flex;gap:2px;align-items:center;position:relative}
.ind{position:absolute;top:0;bottom:0;left:0;border-radius:8px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line2);transition:transform .4s var(--ease),width .4s var(--ease),opacity .2s;pointer-events:none}
.tab{position:relative;font-size:14px;color:var(--fg2);background:none;border:0;border-radius:8px;padding:6px 14px;transition:color .2s}
.tab:hover{color:var(--fg)}.tab[aria-selected=true]{color:var(--fg)}
.sp{flex:1}
.kb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg3);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 10px;transition:border-color .2s,color .2s}
.kb:hover{border-color:var(--line2);color:var(--fg2)}.kb kbd{font:500 11px var(--mono);color:var(--fg3)}
.ib{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;background:none;border:0;color:var(--fg2);transition:background .2s,color .2s}.ib:hover{background:var(--hover);color:var(--fg)}.ib svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.acct{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--fg2);background:none;border:1px solid transparent;border-radius:999px;padding:3px 12px 3px 4px;transition:background .2s,border-color .2s}
.acct:hover,.acct[aria-selected=true]{background:var(--panel);border-color:var(--line);color:var(--fg)}
.av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#ff7c1f,#a35cf5);color:#fff;font-weight:600;font-size:13px;display:grid;place-items:center}
.av.off{background:var(--line2);color:var(--fg2)}
.load{position:fixed;left:0;right:0;top:43px;height:2px;z-index:6;overflow:hidden;opacity:0;transition:opacity .25s}
.load.on{opacity:1}.load i{position:absolute;top:0;bottom:0;width:35%;background:linear-gradient(90deg,transparent,#ff7c1f,#a35cf5,transparent);animation:ld 1.1s ease-in-out infinite}
@keyframes ld{from{left:-35%}to{left:100%}}
/* page */
#home{position:fixed;left:0;right:0;top:44px;bottom:0;overflow:auto;z-index:1}
#home::-webkit-scrollbar{width:10px}#home::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px;border:2px solid transparent;background-clip:padding-box}
.wrap{max-width:1020px;margin:0 auto;padding:34px 28px 56px}
.rise{animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.mono{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg3)}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
h1{font-size:clamp(28px,4.4vw,42px);line-height:1.08;letter-spacing:-.04em;font-weight:600}
.sub{color:var(--fg2);margin-top:4px}
.note{background:rgba(255,68,102,.1);border:1px solid rgba(255,68,102,.4);color:var(--fg);border-radius:10px;padding:10px 14px;margin:0 0 18px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;min-width:0;backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);box-shadow:0 18px 50px -34px rgba(0,0,0,.6)}
.card h2{font-size:15px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.c-today{grid-column:span 7}.c-mail{grid-column:span 5}.c-apps{grid-column:span 12}.c-acct{grid-column:span 12}
@media(max-width:860px){.c-today,.c-mail{grid-column:span 12}}
.link{background:none;border:0;color:var(--orange);font-size:13px;padding:0}.link:hover{text-decoration:underline}
.sec{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);margin:14px 0 8px}.sec:first-of-type{margin-top:0}
.ev{display:flex;gap:12px;align-items:center;padding:8px 10px;border-radius:9px;background:var(--panel2);margin-bottom:6px;border-left:3px solid var(--violet);animation:rise .5s var(--ease) both}
.ev.orange{border-color:var(--orange)}.ev.pink,.ev.red{border-color:#ff4f7a}.ev.green{border-color:var(--green)}.ev.blue{border-color:#4aa8ff}
.ev em{font:500 12px var(--mono);font-style:normal;color:var(--fg3);min-width:52px}
.empty{color:var(--fg3);font-size:14px;padding:6px 2px 8px}
.task{display:flex;align-items:center;gap:11px;padding:7px 4px;border-radius:8px;transition:background .15s,opacity .3s,transform .3s;animation:rise .5s var(--ease) both}
.task:hover{background:var(--hover)}.task.gone{opacity:0;transform:translateX(16px)}
.ck{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);background:none;flex:none;display:grid;place-items:center;transition:background .2s,border-color .2s}
.ck:hover{border-color:var(--orange)}.task.done .ck{background:var(--green);border-color:var(--green)}
.ck svg{width:11px;height:11px;stroke:#0b0a10;stroke-width:3;fill:none;opacity:0;transition:opacity .2s}.task.done .ck svg{opacity:1}
.task.done .tt{color:var(--fg3);text-decoration:line-through}
.tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.due{font:500 11px var(--mono);color:var(--fg3)}.due.late{color:var(--red)}
.add{display:flex;gap:8px;margin-top:10px;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:2px 2px 2px 12px;transition:border-color .15s,box-shadow .2s}
.add:focus-within{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,124,31,.15)}
.add input{flex:1;min-width:0;font:inherit;font-size:14px;color:var(--fg);background:none;border:0;outline:0;padding:8px 0;-webkit-user-select:text;user-select:text}
.add button{border:0;border-radius:8px;background:var(--panel2);color:var(--fg2);padding:0 14px;font-size:13px;transition:background .2s,color .2s}.add button:hover{background:var(--orange);color:#fff}
.mail{display:flex;flex-direction:column;gap:2px}
.mrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 10px;border-radius:9px;transition:background .15s;animation:rise .5s var(--ease) both;background:none;border:0;text-align:left;width:100%}
.mrow:hover{background:var(--hover)}
.mrow b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mrow time{font:500 11px var(--mono);color:var(--fg3)}
.mrow span{grid-column:1/-1;color:var(--fg2);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{font-size:36px;font-weight:600;letter-spacing:-.04em;line-height:1}.big small{font-size:14px;font-weight:400;color:var(--fg2);letter-spacing:0;margin-left:8px}
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.app{display:flex;align-items:center;gap:14px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px;transition:transform .3s var(--ease),border-color .2s,box-shadow .3s}
.app:hover{transform:translateY(-4px);border-color:var(--line2);box-shadow:0 18px 34px -20px rgba(163,92,245,.7)}
.app img{width:40px;height:40px;flex:none;transition:transform .4s var(--ease)}.app:hover img{transform:scale(1.12) rotate(-5deg)}
.app b{display:block;font-weight:600}.app small{color:var(--fg2);font-size:13px}
.acct-row{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.acct-row .who{flex:1;min-width:200px}
.who b{font-size:16px}.who small{display:block;color:var(--fg2)}
.bar2{height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden;width:200px}.bar2 i{display:block;height:100%;width:2%;background:linear-gradient(90deg,#ff7c1f,#a35cf5);transition:width .9s var(--ease)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:7px 14px;font-size:13px;color:var(--fg);transition:background .2s,border-color .2s,transform .12s}.btn:hover{border-color:var(--line2);background:var(--hover)}.btn:active{transform:scale(.97)}
.btn.pri{border:0;color:#fff;background:var(--grad)}.btn.pri:hover{filter:brightness(1.08)}
.foot{margin-top:22px;color:var(--fg3);font-size:12px;font-family:var(--mono)}
.sk{border-radius:8px;background:linear-gradient(90deg,var(--panel2),var(--hover),var(--panel2));background-size:200% 100%;animation:sk 1.3s linear infinite;height:36px;margin-bottom:6px}
@keyframes sk{to{background-position:-200% 0}}
.center{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px 20px 60px}.center .note{max-width:392px;width:100%;text-align:center}
/* opening splash */
#opening{position:fixed;left:0;right:0;top:44px;bottom:0;display:grid;place-items:center;background:var(--bg);z-index:3;animation:fade .25s both}
#opening div{display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--fg2)}
#opening img{width:56px;height:56px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12);opacity:.75}}@keyframes fade{from{opacity:0}}
/* palette */
#pal{position:fixed;inset:0;z-index:20;display:grid;justify-items:center;align-items:start;padding-top:14vh;background:rgba(10,8,16,.45);backdrop-filter:blur(8px);animation:fade .18s both}
#pal .box{width:min(520px,calc(100vw - 32px));background:var(--solid);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;animation:rise .28s var(--ease) both}
#pal input{width:100%;font:inherit;font-size:16px;color:var(--fg);background:none;border:0;border-bottom:1px solid var(--line);outline:0;padding:16px 18px;-webkit-user-select:text;user-select:text}
#pal ul{list-style:none;max-height:300px;overflow:auto;padding:6px}
#pal li{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:9px;cursor:pointer;color:var(--fg2)}
#pal li[aria-selected=true]{background:var(--panel2);color:var(--fg)}

/* chip, banner, toast */
.chip{display:none;align-items:center;gap:6px;font-size:12px;color:var(--fg);background:rgba(255,68,102,.14);border:1px solid rgba(255,68,102,.45);border-radius:999px;padding:3px 10px;-webkit-app-region:no-drag}
.chip.on{display:flex;animation:fade .3s both}.chip i{width:7px;height:7px;border-radius:50%;background:var(--red)}
#ban{position:fixed;left:50%;top:54px;transform:translate(-50%,-14px);opacity:0;pointer-events:none;z-index:7;background:var(--solid);border:1px solid rgba(255,68,102,.5);color:var(--fg);border-radius:12px;padding:9px 16px;font-size:14px;box-shadow:var(--shadow);transition:opacity .35s var(--ease),transform .45s var(--ease);max-width:calc(100vw - 32px)}
#ban.on{opacity:1;transform:translate(-50%,0)}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);opacity:0;pointer-events:none;z-index:30;background:var(--solid);border:1px solid var(--line2);color:var(--fg);border-radius:12px;padding:10px 18px;font-size:14px;box-shadow:var(--shadow);transition:opacity .35s var(--ease),transform .45s var(--ease)}
#toast.on{opacity:1;transform:translate(-50%,0)}#toast.bad{border-color:rgba(255,68,102,.55)}
.lerr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.lerr span{flex:1;min-width:180px}
/* settings */
#set{position:fixed;left:0;right:0;top:44px;bottom:0;overflow:auto;z-index:4;background:var(--bg);animation:fade .3s both}
#set .wrap{max-width:680px}
.sg{margin-bottom:18px}.sg h3{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);margin:0 0 8px 4px}
.sg .card{padding:4px 16px}
.sr{display:flex;align-items:center;gap:16px;padding:13px 0;border-top:1px solid var(--line)}.sr:first-child{border-top:0}
.sr .l{flex:1;min-width:0}.sr .l b{font-weight:500;display:block}.sr .l small{display:block;color:var(--fg2);font-size:13px;margin-top:2px}
.sw{width:42px;height:25px;border-radius:13px;border:0;background:var(--line2);position:relative;flex:none;transition:background .3s var(--ease)}
.sw i{position:absolute;left:3px;top:3px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:transform .35s var(--ease)}
.sw[aria-checked=true]{background:var(--grad)}.sw[aria-checked=true] i{transform:translateX(17px)}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:2px;flex:none}
.seg button{border:0;background:none;color:var(--fg2);font-size:13px;padding:5px 14px;border-radius:8px;transition:background .25s,color .25s}
.seg button[aria-checked=true]{background:var(--solid);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.sel{font:inherit;font-size:13px;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 10px;outline:0;max-width:200px}
.sel:focus{border-color:var(--orange)}
.ib svg.fl{width:22px;height:15px;stroke:none}.lgsel{display:flex;align-items:center;gap:9px}.sk2{font:500 12px var(--mono);color:var(--fg2)}
/* focus */
.c-focus{grid-column:span 12}
.fo{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.fo .big{min-width:130px;font-variant-numeric:tabular-nums;font-family:var(--mono);font-weight:500;font-size:34px}
.fo p{color:var(--fg2);font-size:13px;flex:1;min-width:180px}
.fbar{height:4px;border-radius:2px;background:var(--line);margin-top:12px;overflow:hidden}.fbar i{display:block;height:100%;width:0;background:var(--grad);transition:width 1s linear}
</style></head><body>
<div class="bar">
 <svg class="brand" viewBox="0 0 150 150" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff7c1f"/><stop offset="1" stop-color="#c84bff"/></linearGradient></defs><path d="M75 28 Q55 45 55 70 Q40 65 25 75 Q42 80 53 90 Q45 105 48 122 Q60 110 68 95 Q70 112 75 128 Q80 112 82 95 Q90 110 102 122 Q105 105 97 90 Q108 80 125 75 Q110 65 95 70 Q95 45 75 28Z" fill="url(#g)"/></svg>
 <nav role="tablist" id="n"><i class="ind" id="ind"></i></nav>
 <div class="sp"></div>
 <span class="chip" id="chip"><i></i><span data-i="net.off"></span></span>
 <button class="kb" id="kb"><span data-i="jump"></span><kbd id="kbk">Ctrl K</kbd></button>
 <button class="ib" id="th" data-ia="tm.toggle"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></button>
 <button class="ib" id="st" data-ia="set.title"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
 <button class="ib" id="lg" aria-label="Language" title="Language"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg></button>
 <button class="acct" id="acct" aria-haspopup="menu"><span class="av off" id="av">?</span><span id="an"></span></button>
</div>
<div class="load" id="load"><i></i></div>
<div id="ban" role="status" data-i="net.banner"></div><div id="toast" role="status"></div>

<main id="home" tabindex="-1">
 <div class="center" id="out" hidden>
  <div class="note" id="note-out" role="status" hidden></div>
  <div id="signin" style="width:100%;display:flex;justify-content:center"></div>
 </div>
 <div class="wrap" id="in" hidden>
  <div class="hd rise"><div><h1 id="greet"></h1><p class="sub" id="date"></p></div></div>
  <div class="note" id="note-in" role="status" hidden></div>
  <div class="note" id="lerr" hidden><div class="lerr"><span id="lerrt"></span><button class="btn" id="lretry" data-i="net.retry"></button></div></div>
  <div class="grid">
   <section class="card c-today rise" style="--i:1"><h2><span data-i="today"></span> <button class="link" id="open-dusk" data-i="open.dusk"></button></h2>
    <div id="today"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
    <form class="add" id="addf"><input id="addi" data-ip="tk.ph" maxlength="200" autocomplete="off"><button type="submit" data-i="tk.add"></button></form>
   </section>
   <section class="card c-mail rise" style="--i:2"><h2><span data-i="inbox"></span> <button class="link" id="open-fledge" data-i="open.fledge"></button></h2>
    <div class="big" id="unread">&mdash;</div>
    <div class="mail" id="mail" style="margin-top:12px"><div class="sk"></div><div class="sk"></div></div>
   </section>
   <section class="card c-focus rise" style="--i:3"><h2 data-i="focus.t"></h2><div class="fo"><div class="big" id="fclock">25:00</div><div class="seg" id="fseg"></div><button class="btn pri" id="fgo" data-i="focus.start"></button><p id="fhint" data-i="focus.idle"></p></div><div class="fbar"><i id="fbar"></i></div></section>
   <section class="card c-apps rise" style="--i:3"><h2 data-i="apps"></h2><div class="apps" id="grid"></div></section>
   <section class="card c-acct rise" style="--i:4"><div class="acct-row">
     <div class="who"><div class="mono" data-i="signedas"></div><b id="who">&mdash;</b><small id="store"></small><div class="bar2"><i id="bar"></i></div></div>
     <div class="btns"><button class="btn pri" id="b-acct" data-i="acct"></button><button class="btn" id="b-upd" data-i="upd"></button><button class="btn" id="b-out" data-i="out"></button></div>
   </div></section>
  </div>
  <div class="foot" id="ver"></div>
 </div>
</main>
<section id="set" hidden><div class="wrap"><div class="hd"><h1 data-i="set.title"></h1><button class="btn pri" id="setx" data-i="set.close"></button></div><div id="setb"></div></div></section>
<div id="opening" hidden><div><img id="op-img" alt=""><span id="op-t"></span></div></div>
<div id="pal" hidden><div class="box"><input id="pi" data-ip="jump.ph" autocomplete="off"><ul id="pl"></ul></div></div>

<script>
var APPS = {}, ART = { dusk: '../build/art/dusk-icon.svg', fledge: '../build/art/fledge-logo.svg', aster: '../build/art/aster-logo.svg' };
var $ = function (id) { return document.getElementById(id); };
var t = function (k, v) { return i18n.t(k, v); };
var user = null, cur = 'home', widget = null, loading = {}, mod = 'Ctrl', data = null, helloW = null;
mountScene();

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function tabs() {
  var n = $('n'); [].slice.call(n.querySelectorAll('.tab')).forEach(function (e) { e.remove(); });

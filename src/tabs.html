<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lareon</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#13111b;--panel:#1a1824;--panel2:#211e2d;--line:#2b2838;--line2:#3b3750;--fg:#ece9f5;--fg2:#a7a4ba;--fg3:#74718a;--orange:#ff7c1f;--violet:#a35cf5;--green:#3ddc84;--red:#ff4466;
--sans:Geist,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:radial-gradient(70% 50% at 15% -10%,rgba(163,92,245,.16),transparent 60%),radial-gradient(60% 45% at 100% 0,rgba(255,124,31,.1),transparent 60%),var(--bg);color:var(--fg);font:15px/1.5 var(--sans);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:6px}
/* title bar: the tabs are the title bar, the window buttons sit inside it */
.bar{position:fixed;left:0;right:0;top:0;height:44px;display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;-webkit-app-region:drag;background:rgba(19,17,27,.9);backdrop-filter:blur(14px);z-index:5;border-bottom:1px solid var(--line)}
.mac .bar{padding-left:86px}
.bar{padding-right:calc(100vw - env(titlebar-area-x,0px) - env(titlebar-area-width,100vw) + 8px)}
.bar button{-webkit-app-region:no-drag}
.brand{width:22px;height:22px;margin-right:4px;flex:none}
nav{display:flex;gap:2px;align-items:center;position:relative}
.ind{position:absolute;top:0;bottom:0;left:0;border-radius:8px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line2);transition:transform .35s var(--ease),width .35s var(--ease),opacity .2s;pointer-events:none}
.tab{position:relative;font-size:14px;color:var(--fg2);background:none;border:0;border-radius:8px;padding:6px 14px;transition:color .2s}
.tab:hover{color:var(--fg)}.tab[aria-selected=true]{color:#fff}
.sp{flex:1}
.kb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg3);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 10px;transition:border-color .2s,color .2s}
.kb:hover{border-color:var(--line2);color:var(--fg2)}.kb kbd{font:500 11px var(--mono);color:var(--fg3)}
.acct{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--fg2);background:none;border:1px solid transparent;border-radius:999px;padding:3px 12px 3px 4px;transition:background .2s,border-color .2s}
.acct:hover,.acct[aria-selected=true]{background:var(--panel);border-color:var(--line);color:#fff}
.av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#ff7c1f,#a35cf5);color:#fff;font-weight:600;font-size:13px;display:grid;place-items:center}
.av.off{background:#2b2838;color:var(--fg2)}
.load{position:fixed;left:0;right:0;top:43px;height:2px;z-index:6;overflow:hidden;opacity:0;transition:opacity .25s}
.load.on{opacity:1}.load i{position:absolute;top:0;bottom:0;width:35%;background:linear-gradient(90deg,transparent,#ff7c1f,#a35cf5,transparent);animation:ld 1.1s ease-in-out infinite}
@keyframes ld{from{left:-35%}to{left:100%}}
/* page */
#home{position:fixed;left:0;right:0;top:44px;bottom:0;overflow:auto;background:none}
#home[hidden]{display:none}
#home::-webkit-scrollbar{width:10px}#home::-webkit-scrollbar-thumb{background:#2b2838;border-radius:5px;border:2px solid var(--bg)}
.wrap{position:relative;z-index:1;max-width:1020px;margin:0 auto;padding:34px 28px 56px}
[hidden]{display:none!important}
.rise{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.mono{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg3)}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
h1{font-size:clamp(26px,4vw,36px);line-height:1.1;letter-spacing:-.035em;font-weight:600}
.sub{color:var(--fg2);margin-top:4px}
.note{background:rgba(255,68,102,.08);border:1px solid rgba(255,68,102,.35);color:#ffb3c0;border-radius:10px;padding:10px 14px;margin:0 0 18px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;min-width:0}
.card h2{font-size:15px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.c-today{grid-column:span 7}.c-mail{grid-column:span 5}.c-apps{grid-column:span 12}.c-acct{grid-column:span 12}
@media(max-width:860px){.c-today,.c-mail{grid-column:span 12}}
.link{background:none;border:0;color:var(--orange);font-size:13px;padding:0}.link:hover{text-decoration:underline}
.sec{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);margin:14px 0 8px}.sec:first-of-type{margin-top:0}
.ev{display:flex;gap:12px;align-items:center;padding:8px 10px;border-radius:9px;background:var(--panel2);margin-bottom:6px;border-left:3px solid var(--violet);animation:rise .45s var(--ease) both}
.ev.orange{border-color:var(--orange)}.ev.pink,.ev.red{border-color:#ff4f7a}.ev.green{border-color:var(--green)}.ev.blue{border-color:#4aa8ff}
.ev em{font:500 12px var(--mono);font-style:normal;color:var(--fg3);min-width:48px}
.empty{color:var(--fg3);font-size:14px;padding:6px 2px 8px}
.task{display:flex;align-items:center;gap:11px;padding:7px 4px;border-radius:8px;transition:background .15s,opacity .3s,transform .3s;animation:rise .45s var(--ease) both}
.task:hover{background:var(--panel2)}
.task.gone{opacity:0;transform:translateX(16px)}
.ck{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);background:none;flex:none;display:grid;place-items:center;transition:background .2s,border-color .2s}
.ck:hover{border-color:var(--orange)}.task.done .ck{background:var(--green);border-color:var(--green)}
.ck svg{width:11px;height:11px;stroke:#0b0a10;stroke-width:3;fill:none;opacity:0;transition:opacity .2s}.task.done .ck svg{opacity:1}
.task.done .tt{color:var(--fg3);text-decoration:line-through}
.tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.due{font:500 11px var(--mono);color:var(--fg3)}.due.late{color:var(--red)}
.add{display:flex;gap:8px;margin-top:10px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:2px 2px 2px 12px;transition:border-color .15s,box-shadow .2s}
.add:focus-within{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,124,31,.13)}
.add input{flex:1;min-width:0;font:inherit;font-size:14px;color:var(--fg);background:none;border:0;outline:0;padding:8px 0;-webkit-user-select:text;user-select:text}
.add button{border:0;border-radius:7px;background:var(--panel2);color:var(--fg2);padding:0 12px;font-size:13px;transition:background .2s,color .2s}.add button:hover{background:var(--orange);color:#fff}
.mail{display:flex;flex-direction:column;gap:2px}
.mrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 10px;border-radius:9px;transition:background .15s;animation:rise .45s var(--ease) both;cursor:pointer;background:none;border:0;text-align:left;width:100%}
.mrow:hover{background:var(--panel2)}
.mrow b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mrow time{font:500 11px var(--mono);color:var(--fg3)}
.mrow span{grid-column:1/-1;color:var(--fg2);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{font-size:34px;font-weight:600;letter-spacing:-.04em;line-height:1}.big small{font-size:14px;font-weight:400;color:var(--fg2);letter-spacing:0;margin-left:6px}
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.app{display:flex;align-items:center;gap:14px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;transition:transform .25s var(--ease),border-color .2s,background .2s,box-shadow .25s}
.app:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:0 14px 30px -18px rgba(163,92,245,.6)}
.app img{width:38px;height:38px;flex:none;transition:transform .35s var(--ease)}.app:hover img{transform:scale(1.1) rotate(-4deg)}
.app b{display:block;font-weight:600}.app small{color:var(--fg2);font-size:13px}
.acct-row{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.acct-row .who{flex:1;min-width:200px}
.who b{font-size:16px}.who small{display:block;color:var(--fg2)}
.bar2{height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden;width:200px}.bar2 i{display:block;height:100%;width:2%;background:linear-gradient(90deg,#ff7c1f,#a35cf5);transition:width .8s var(--ease)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:7px 14px;font-size:13px;color:var(--fg);transition:background .2s,border-color .2s,transform .12s}.btn:hover{border-color:var(--line2);background:#292539}.btn:active{transform:scale(.97)}
.btn.pri{border:0;color:#fff;background:linear-gradient(90deg,#ff7c1f,#d94fc4 60%,#a35cf5)}.btn.pri:hover{filter:brightness(1.08)}
.foot{margin-top:22px;color:var(--fg3);font-size:12px;font-family:var(--mono)}
.sk{border-radius:8px;background:linear-gradient(90deg,var(--panel2),#2a2638,var(--panel2));background-size:200% 100%;animation:sk 1.3s linear infinite;height:36px;margin-bottom:6px}
@keyframes sk{to{background-position:-200% 0}}
/* signed out */
.hello{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;min-height:calc(100vh - 44px);justify-content:center;padding:24px 20px 12vh}
.hello h1{margin-bottom:6px}.hello .sub{margin:0 0 22px}
/* opening splash */
#opening{position:fixed;left:0;right:0;top:44px;bottom:0;display:grid;place-items:center;background:var(--bg);z-index:3;animation:fade .25s both}
#opening div{display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--fg2)}
#opening img{width:56px;height:56px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12);opacity:.75}}@keyframes fade{from{opacity:0}}
/* palette */
#pal{position:fixed;inset:0;z-index:20;display:grid;justify-items:center;align-items:start;padding-top:14vh;background:rgba(10,8,16,.6);backdrop-filter:blur(6px);animation:fade .18s both}
#pal .box{width:min(520px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:0 40px 90px -20px rgba(0,0,0,.8);overflow:hidden;animation:rise .25s var(--ease) both}
#pal input{width:100%;font:inherit;font-size:16px;color:var(--fg);background:none;border:0;border-bottom:1px solid var(--line);outline:0;padding:16px 18px;-webkit-user-select:text;user-select:text}
#pal ul{list-style:none;max-height:300px;overflow:auto;padding:6px}
#pal li{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--fg2)}
#pal li[aria-selected=true]{background:var(--panel2);color:#fff}
#pal li small{margin-left:auto;font:500 11px var(--mono);color:var(--fg3)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="bar">
 <svg class="brand" viewBox="0 0 150 150" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff7c1f"/><stop offset="1" stop-color="#c84bff"/></linearGradient></defs><path d="M75 28 Q55 45 55 70 Q40 65 25 75 Q42 80 53 90 Q45 105 48 122 Q60 110 68 95 Q70 112 75 128 Q80 112 82 95 Q90 110 102 122 Q105 105 97 90 Q108 80 125 75 Q110 65 95 70 Q95 45 75 28Z" fill="url(#g)"/></svg>
 <nav role="tablist" id="n"><i class="ind" id="ind"></i></nav>
 <div class="sp"></div>
 <button class="kb" id="kb" title="Jump to anything"><span>Jump to</span><kbd id="kbk">Ctrl K</kbd></button>
 <button class="acct" id="acct" aria-haspopup="menu"><span class="av off" id="av">?</span><span id="an">Sign in</span></button>
</div>
<div class="load" id="load"><i></i></div>

<main id="home" tabindex="-1">
 <div class="hello" id="out" hidden>
  <h1 class="rise">Welcome to Lareon</h1>
  <p class="sub rise" style="--i:1">Sign in once. Dusk, Fledge and Aster open already signed in.</p>
  <div class="note" id="note-out" role="status" hidden></div>
  <div class="rise" style="--i:2;width:100%;display:flex;justify-content:center" id="signin"></div>
 </div>
 <div class="wrap" id="in" hidden>
  <div class="hd rise"><div><h1 id="greet">Hello</h1><p class="sub" id="date"></p></div></div>
  <div class="note" id="note-in" role="status" hidden></div>
  <div class="grid">
   <section class="card c-today rise" style="--i:1"><h2>Today <button class="link" id="open-dusk">Open Dusk</button></h2>
    <div id="today"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
    <form class="add" id="addf"><input id="addi" placeholder="Add a task for today" maxlength="200" autocomplete="off"><button type="submit">Add</button></form>
   </section>
   <section class="card c-mail rise" style="--i:2"><h2>Inbox <button class="link" id="open-fledge">Open Fledge</button></h2>
    <div class="big" id="unread">&mdash;<small>unread</small></div>
    <div class="mail" id="mail" style="margin-top:12px"><div class="sk"></div><div class="sk"></div></div>
   </section>
   <section class="card c-apps rise" style="--i:3"><h2>Your apps</h2><div class="apps" id="grid"></div></section>
   <section class="card c-acct rise" style="--i:4"><div class="acct-row">
     <div class="who"><div class="mono">Signed in as</div><b id="who">&mdash;</b><small id="store"></small><div class="bar2"><i id="bar"></i></div></div>
     <div class="btns"><button class="btn pri" id="b-acct">Account settings</button><button class="btn" id="b-upd">Check for updates</button><button class="btn" id="b-out">Sign out</button></div>
   </div></section>
  </div>
  <div class="foot" id="ver"></div>
 </div>
</main>
<div id="opening" hidden><div><img id="op-img" alt=""><span id="op-t">Opening&hellip;</span></div></div>
<div id="pal" hidden><div class="box"><input id="pi" placeholder="Jump to an app or action" autocomplete="off"><ul id="pl"></ul></div></div>

<script src="scene.js"></script>
<script src="signin.js"></script>
<script>
var APPS = {}, ART = { dusk: '../build/art/dusk-icon.svg', fledge: '../build/art/fledge-logo.svg', aster: '../build/art/aster-logo.svg' };
var WHAT = { dusk: 'Calendar, tasks and notes', fledge: 'Private email', aster: 'Your assistant' };
var $ = function (id) { return document.getElementById(id); };
var user = null, cur = 'home', widget = null, loading = {}, mod = 'Ctrl', scene = null, data = null;

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function tabs() {
  var n = $('n'); [].slice.call(n.querySelectorAll('.tab')).forEach(function (e) { e.remove(); });
  function add(k, label) { var b = document.createElement('button'); b.className = 'tab'; b.id = 't-' + k; b.setAttribute('role', 'tab'); b.textContent = label; b.onclick = function () { lareon.show(k); }; n.appendChild(b); }
  add('home', 'Home'); Object.keys(APPS).forEach(function (k) { add(k, APPS[k].name); });
  moveInd();
}
function moveInd() {
  var t = $('t-' + cur), i = $('ind'); if (!t) { i.style.opacity = 0; return; }
  i.style.opacity = 1; i.style.width = t.offsetWidth + 'px'; i.style.transform = 'translateX(' + t.offsetLeft + 'px)';
  [].forEach.call(document.querySelectorAll('.tab'), function (b) { b.setAttribute('aria-selected', b.id === 't-' + cur ? 'true' : 'false'); });
  $('acct').setAttribute('aria-selected', cur === 'account' ? 'true' : 'false');
}
function setAcct() {
  $('av').textContent = user ? ((user.name || user.username || '?').charAt(0).toUpperCase()) : '?';
  $('av').className = 'av' + (user ? '' : ' off');
  $('an').textContent = user ? (user.name || user.username) : 'Sign in';
}
function note(m) { ['note-out', 'note-in'].forEach(function (id) { var e = $(id); e.textContent = m || ''; e.hidden = !m; }); }
function grid() {
  var g = $('grid'); g.innerHTML = '';
  Object.keys(APPS).forEach(function (k) {
    var b = document.createElement('button'); b.className = 'app';
    b.innerHTML = '<img src="' + ART[k] + '" alt=""><span><b>' + esc(APPS[k].name) + '</b><small>' + WHAT[k] + '</small></span>';
    b.onclick = function () { lareon.show(k); }; g.appendChild(b);
  });
}
function greet() {
  var h = new Date().getHours(), p = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
  var first = user ? String(user.name || user.username || '').split(' ')[0] : '';
  $('greet').textContent = p + (first ? ', ' + first : '');
  $('date').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
}
function render() {
  setAcct(); moveInd();
  var opening = cur !== 'home' && loading[cur];
  $('home').hidden = cur !== 'home' && !opening;
  $('opening').hidden = !opening;
  if (opening) { $('op-img').src = ART[cur] || '../build/art/lareon-icon.svg'; $('op-t').textContent = 'Opening ' + ((APPS[cur] && APPS[cur].name) || 'Account') + '…'; }
  $('load').className = 'load' + (loading[cur] ? ' on' : '');
  $('out').hidden = !!user; $('in').hidden = !user;
  if (user && cur === 'home') { greet(); $('who').textContent = (user.username || '') + '@lareon.org'; }
  if (!user && !scene) scene = mountScene();
  if (user && scene) { scene.remove(); scene = null; }
  if (!user && widget && cur === 'home') widget.focus();
}
function ago(iso) {
  var t = new Date(iso).getTime(); if (!t) return ''; var s = (Date.now() - t) / 1000;
  if (s < 90) return 'now'; if (s < 3600) return Math.round(s / 60) + 'm'; if (s < 86400) return Math.round(s / 3600) + 'h';
  if (s < 604800) return Math.round(s / 86400) + 'd'; return new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}
function sender(a) { a = String(a || ''); var m = a.match(/^\s*"?([^"<]+?)"?\s*<.*>\s*$/); return m ? m[1] : a.split('@')[0] || a; }
function fmtT(t) { if (!t) return 'All day'; var p = t.split(':'), h = +p[0], ap = h >= 12 ? 'pm' : 'am'; return ((h + 11) % 12 + 1) + (p[1] === '00' ? '' : ':' + p[1]) + ap; }
function taskRow(t, i) {
  var d = document.createElement('div'); d.className = 'task'; d.style.animationDelay = (i * 40) + 'ms';
  var today = new Date(); var iso = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
  d.innerHTML = '<button class="ck" aria-label="Mark done"><svg viewBox="0 0 12 12"><path d="M2 6.5l2.6 2.6L10 3.5"/></svg></button><span class="tt">' + esc(t.title) + '</span>' + (t.due && t.due < iso ? '<span class="due late">Overdue</span>' : t.pri ? '<span class="due" style="color:#ff7c1f">Priority</span>' : '');
  d.querySelector('.ck').onclick = function () {
    d.classList.add('done');
    lareon.doneTask(t.id, true).then(function (ok) { if (!ok) { d.classList.remove('done'); return; } setTimeout(function () { d.classList.add('gone'); setTimeout(function () { d.remove(); if (!document.querySelector('#today .task')) load(true); }, 300); }, 380); });
  };
  return d;
}
function paint() {
  if (!data) return;
  var td = $('today'); td.innerHTML = '';
  var h = document.createElement('div'); h.className = 'sec'; h.textContent = 'Events'; td.appendChild(h);
  if (!data.events.length) { var e = document.createElement('div'); e.className = 'empty'; e.textContent = 'Nothing scheduled today.'; td.appendChild(e); }
  data.events.forEach(function (ev, i) { var d = document.createElement('div'); d.className = 'ev ' + esc(ev.color); d.style.animationDelay = (i * 40) + 'ms'; d.innerHTML = '<em>' + fmtT(ev.start) + '</em><span class="tt">' + esc(ev.title) + '</span>'; td.appendChild(d); });
  var h2 = document.createElement('div'); h2.className = 'sec'; h2.textContent = 'Tasks'; td.appendChild(h2);
  if (!data.tasks.length) { var e2 = document.createElement('div'); e2.className = 'empty'; e2.textContent = 'You are all caught up.'; td.appendChild(e2); }
  data.tasks.forEach(function (t, i) { td.appendChild(taskRow(t, i)); });
  var s = data.summary;
  if (s) {
    $('unread').innerHTML = s.unread + '<small>' + (s.unread === 1 ? 'unread message' : 'unread messages') + '</small>';
    var m = $('mail'); m.innerHTML = '';
    if (!(s.recent || []).length) m.innerHTML = '<div class="empty">Your inbox is empty.</div>';
    (s.recent || []).forEach(function (x, i) { var b = document.createElement('button'); b.className = 'mrow'; b.style.animationDelay = (i * 50) + 'ms'; b.innerHTML = '<b>' + esc(sender(x.from_address)) + '</b><time>' + ago(x.created_at) + '</time><span>' + esc(x.subject || '(no subject)') + '</span>'; b.onclick = function () { lareon.show('fledge'); }; m.appendChild(b); });
    var used = s.used || 0, txt = used >= 1073741824 ? (used / 1073741824).toFixed(1) + ' GB' : (used / 1048576).toFixed(used < 10485760 ? 1 : 0) + ' MB';
    $('store').textContent = txt + ' of storage used'; $('bar').style.width = Math.max(2, s.percent || 0) + '%';
  }
}
function load(quiet) {
  if (!user) return;
  lareon.homeData().then(function (d) { if (!d) { if (!data) { $('today').innerHTML = '<div class="empty">Can’t reach Lareon right now.</div>'; $('mail').innerHTML = ''; } return; } data = d; paint(); });
}
$('addf').onsubmit = function (e) {
  e.preventDefault(); var v = $('addi').value.trim(); if (!v) return; $('addi').value = '';
  lareon.addTask(v).then(function (ok) { if (ok) load(true); else note('Could not add the task. Try again.'); });
};
$('acct').onclick = function () { var r = $('acct').getBoundingClientRect(); lareon.menu({ x: Math.round(r.left), y: Math.round(r.bottom + 4) }); };
$('open-dusk').onclick = function () { lareon.show('dusk'); }; $('open-fledge').onclick = function () { lareon.show('fledge'); };
$('b-acct').onclick = function () { lareon.show('account'); }; $('b-upd').onclick = function () { lareon.checkUpdates(); }; $('b-out').onclick = function () { lareon.signOut(); };

// jump to anything (Cmd/Ctrl + K)
var items = [], sel = 0;
function palItems() {
  var a = [{ n: 'Home', k: 'home' }]; Object.keys(APPS).forEach(function (k) { a.push({ n: 'Open ' + APPS[k].name, k: k }); });
  if (user) { a.push({ n: 'Account settings', k: 'account' }, { n: 'Check for updates', f: function () { lareon.checkUpdates(); } }, { n: 'Sign out', f: function () { lareon.signOut(); } }); }
  return a;
}
function palRender() {
  var q = $('pi').value.toLowerCase(); items = palItems().filter(function (x) { return x.n.toLowerCase().indexOf(q) >= 0; }); sel = Math.min(sel, Math.max(0, items.length - 1));
  $('pl').innerHTML = items.map(function (x, i) { return '<li data-i="' + i + '" aria-selected="' + (i === sel) + '">' + esc(x.n) + '</li>'; }).join('') || '<li>Nothing found</li>';
  [].forEach.call($('pl').querySelectorAll('li[data-i]'), function (li) { li.onclick = function () { run(+li.getAttribute('data-i')); }; });
}
function run(i) { var x = items[i]; if (!x) return; palClose(); if (x.f) x.f(); else lareon.show(x.k); }
function palOpen() { if (!$('pal').hidden) return; $('pal').hidden = false; $('pi').value = ''; sel = 0; palRender(); setTimeout(function () { $('pi').focus(); }, 20); }
function palClose() { $('pal').hidden = true; }
$('pi').oninput = function () { sel = 0; palRender(); };
$('pal').onclick = function (e) { if (e.target === $('pal')) palClose(); };
$('kb').onclick = palOpen;
document.addEventListener('keydown', function (e) {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('pal').hidden ? palOpen() : palClose(); return; }
  if ($('pal').hidden) return;
  if (e.key === 'Escape') palClose();
  else if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(items.length - 1, sel + 1); palRender(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(0, sel - 1); palRender(); }
  else if (e.key === 'Enter') { e.preventDefault(); run(sel); }
});
window.addEventListener('resize', moveInd);

lareon.onShown(function (k) { cur = k; render(); if (k === 'home' && user) load(true); });
lareon.onLoading(function (v) { loading[v.key] = v.on; render(); });
lareon.onPalette(palOpen);
lareon.onNote(function (m) { note(m); });
lareon.onSession(function (u) { user = u; data = null; if (u) { note(''); render(); load(); } else render(); });
setInterval(function () { if (cur === 'home' && user) load(true); }, 90000);

widget = mountSignin($('signin'), { onDone: function (u) { user = u; note(''); cur = 'home'; render(); load(); } });
Promise.all([lareon.apps(), lareon.session(), lareon.info()]).then(function (r) {
  APPS = r[0]; user = r[1];
  if (r[2].platform === 'darwin') { document.documentElement.className = 'mac'; mod = 'Cmd'; }
  $('kbk').textContent = mod === 'Cmd' ? '⌘K' : 'Ctrl K';
  $('ver').textContent = 'Lareon ' + r[2].version;
  tabs(); grid(); render(); if (user) load();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveInd);
});

<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Capture</title><link rel="stylesheet" href="theme.css"><script src="theme.js"></script>
<style>
html,body{height:100%;overflow:hidden}body{display:flex;flex-direction:column;background:var(--solid);border:1px solid var(--line2);border-radius:16px;position:relative}
body:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--grad);border-radius:16px 16px 0 0}
.hd{display:flex;align-items:center;gap:10px;padding:14px 14px 8px 16px;-webkit-app-region:drag}.hd b{flex:1;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hd small{color:var(--fg3);font:500 12px var(--mono)}
.x{-webkit-app-region:no-drag;width:28px;height:28px;border-radius:8px;border:0;background:none;color:var(--fg2);display:grid;place-items:center}.x:hover{background:var(--hover)}.x svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.pv{flex:1;min-height:0;margin:0 14px;border-radius:12px;background:repeating-conic-gradient(var(--panel2) 0 25%,var(--panel) 0 50%) 0 0/16px 16px;display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.pv img,.pv video{max-width:100%;max-height:100%;display:block}
.acts{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px 6px}
.acts button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--fg)}.acts button:hover{border-color:var(--line2)}.acts button img{width:18px;height:18px}
.acts button.pri{border:0;background:var(--grad);color:#fff}.acts button:disabled{opacity:.5}
#msg{padding:2px 16px 12px;font-size:13px;color:var(--fg3);min-height:18px}#msg.ok{color:var(--green)}#msg.bad{color:var(--red)}
.bar{height:4px;border-radius:2px;background:var(--line);margin:0 16px 6px;overflow:hidden;display:none}.bar.on{display:block}.bar i{display:block;height:100%;width:0;background:var(--grad);transition:width .2s}
</style></head><body>
<div class="hd"><b id="nm"></b><small id="sz"></small><button class="x" id="x" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<div class="pv" id="pv"></div>
<div class="acts" id="acts"></div>
<div class="bar" id="bar"><i id="bi"></i></div><div id="msg"></div>
<script src="i18n-more.js"></script><script src="i18n-apps.js"></script><script src="i18n.js"></script>
<script>
var $ = function (i) { return document.getElementById(i); }, t = function (k, v) { return i18n.t(k, v); }, F = null, CAT = {}, busy = false;
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function size(b) { return b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB'; }
function msg(m, c) { $('msg').className = c || ''; $('msg').textContent = m || ''; }
function art(k) { return CAT[k] ? '../build/art/' + CAT[k].art : ''; }
function acts() {
  var A = [];
  if (F.kind === 'image') A.push(['copy', t('cp.copy'), '']);
  A.push(['save', t('cp.save'), '']);
  if (CAT.cove) A.push(['cove', t('cp.cove'), art('cove')]);
  if (CAT.sheen && F.kind === 'image') A.push(['sheen', t('cp.sheen'), art('sheen')]);
  if (CAT.fledge) A.push(['email', t('cp.email'), art('fledge')]);
  A.push(['discard', t('cp.discard'), '']);
  $('acts').innerHTML = A.map(function (a, i) { return '<button data-a="' + a[0] + '"' + (i === 0 ? ' class="pri"' : '') + '>' + (a[2] ? '<img src="' + a[2] + '" alt="">' : '') + esc(a[1]) + '</button>'; }).join('');
  [].forEach.call($('acts').querySelectorAll('button'), function (b) { b.onclick = function () { act(b.getAttribute('data-a')); }; });
}
function act(w) {
  if (busy) return; busy = true; msg(w === 'cove' || w === 'sheen' ? t('cp.uploading') : ''); if (w === 'cove' || w === 'sheen') { $('bar').className = 'bar on'; $('bi').style.width = '3%'; }
  lareon.capAct(w).then(function (r) {
    busy = false; $('bar').className = 'bar';
    if (!r || r.canceled) return msg('');
    if (r.error) return msg(r.error, 'bad');
    if (w === 'copy') msg(t('cp.copied'), 'ok'); else if (w === 'save') msg(t('cp.saved'), 'ok'); else if (w === 'cove') msg(t('cp.incove', { f: r.name }), 'ok');
  });
}
lareon.onCapProgress(function (p) { $('bi').style.width = Math.round(p * 100) + '%'; });
lareon.onCapResult(function (f) {
  F = f; busy = false; msg(F.kind === 'image' ? t('cp.inclip') : ''); if (F.kind === 'image') $('msg').className = 'ok';
  $('nm').textContent = F.name; $('sz').textContent = size(F.size);
  $('pv').innerHTML = F.kind === 'image' ? '<img alt="">' : '<video controls autoplay muted></video>';
  $('pv').firstChild.src = 'file://' + F.path.split('\\').join('/') + '?' + Date.now();
  lareon.appsAll().then(function () { return lareon.apps(); }).then(function (a) { CAT = a || {}; acts(); });
});
$('x').onclick = function () { lareon.capAct('close'); };
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') lareon.capAct('close'); if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'c' && F && F.kind === 'image') act('copy'); });
lareon.info().then(function (r) { i18n.set(r.lang || i18n.guess(r.locale), true); if (F) acts(); });
</script></body></html>

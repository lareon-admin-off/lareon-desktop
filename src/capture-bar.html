<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Capture</title><link rel="stylesheet" href="theme.css"><script src="theme.js"></script>
<style>
html,body{height:100%;overflow:hidden;background:transparent}body{display:flex;flex-direction:column;background:var(--solid);border:1px solid var(--line2);border-radius:18px}
.row{display:flex;align-items:center;gap:6px;padding:10px}
.row button{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;border:0;background:none;color:var(--fg2);font-size:12px;padding:7px 4px;border-radius:12px;transition:background .15s,color .15s}
.row button:hover{background:var(--hover);color:var(--fg)}.row svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.row .rec svg{stroke:none;fill:#ff4466}.sep{width:1px;height:34px;background:var(--line)}
#wins{display:none;grid-template-columns:repeat(3,1fr);gap:8px;padding:4px 10px 12px;overflow:auto}#wins.on{display:grid}
#wins button{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:6px;color:var(--fg);font-size:11.5px;text-align:left}#wins button:hover{border-color:var(--orange)}
#wins img{display:block;width:100%;height:72px;object-fit:contain;border-radius:6px;background:#0004;margin-bottom:4px}#wins span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body>
<div class="row">
 <button id="area"><svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/></svg><span data-i="cp.area"></span></button>
 <button id="win"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/></svg><span data-i="cp.window"></span></button>
 <button id="scr"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span data-i="cp.screen"></span></button>
 <div class="sep"></div>
 <button id="rec" class="rec"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></svg><span data-i="cp.record"></span></button>
 <div class="sep"></div>
 <button id="x"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg><span data-i="set.close"></span></button>
</div>
<div id="wins"></div>
<script src="i18n-more.js"></script><script src="i18n-apps.js"></script><script src="i18n.js"></script>
<script>
var $ = function (i) { return document.getElementById(i); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
lareon.info().then(function (r) { i18n.set(r.lang || i18n.guess(r.locale), true); });
lareon.onCapBar(function () { $('wins').className = ''; lareon.capBarSize(76); });
$('area').onclick = function () { lareon.capArea(); }; $('scr').onclick = function () { lareon.capScreen(); }; $('rec').onclick = function () { lareon.capRecord(); }; $('x').onclick = function () { lareon.capClose(); };
$('win').onclick = function () {
  lareon.capWindows().then(function (w) {
    var b = $('wins'); b.className = 'on'; b.innerHTML = w.length ? w.map(function (x) { return '<button data-id="' + esc(x.id) + '"><img src="' + x.thumb + '" alt=""><span>' + esc(x.name) + '</span></button>'; }).join('') : '<span style="grid-column:1/-1;color:var(--fg3);font-size:13px;padding:6px">' + esc(i18n.t('cp.nowin')) + '</span>';
    [].forEach.call(b.querySelectorAll('button'), function (x) { x.onclick = function () { lareon.capWindow(x.getAttribute('data-id')); }; });
    lareon.capBarSize(90 + Math.ceil(Math.max(1, w.length) / 3) * 104);
  });
};
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') lareon.capClose(); });
</script></body></html>

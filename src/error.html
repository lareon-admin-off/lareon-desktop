2": ["Sunucuya ulaşamıyoruz", "Lareon’da şu anda bir sorun var. Genellikle birkaç dakika içinde düzelir."], "503": ["Hemen döneceğiz", "Lareon hızlı bir güncelleme için kapalı ya da çok yoğun. E-postalarınız ve verileriniz güvende."], "504": ["Çok uzun sürdü", "Sunucu zamanında yanıt vermedi. Biraz sonra tekrar deneyin."]}, "sv": {"ui": {"retry": "Försök igen", "home": "Tillbaka till Lareon", "help": "Få hjälp", "signin": "Logga in", "auto": "Den här sidan försöker igen av sig själv var 30:e sekund."}, "offline": ["{a} kan inte ansluta", "Kontrollera din internetanslutning. Inget går förlorat, och appen fortsätter där du var när du försöker igen."], "400": ["Begäran fungerade inte", "Något i begäran var fel. Gå tillbaka och försök igen, eller börja om från startsidan."], "401": ["Logga in för att fortsätta", "Du måste vara inloggad för att öppna detta. Logga in med ditt Lareon-konto och försök igen."], "403": ["Du kan inte öppna detta", "Du har inte åtkomst till den här sidan. Tror du att det är ett misstag, hör av dig."], "404": ["Sidan hittades inte", "Sidan finns inte eller har flyttats. Kontrollera adressen eller gå tillbaka."], "405": ["Det här är inte tillåtet", "Den här adressen kan inte öppnas så. Gå tillbaka och börja om."], "408": ["Begäran tog för lång tid", "Vi fick inte din begäran i tid. Kontrollera anslutningen och försök igen."], "410": ["Länken finns inte längre", "Den kan ha gått ut, redan använts eller tagits bort. Av säkerhetsskäl slutar sådana länkar fungera efter en tid."], "413": ["Filen är för stor", "Fledge tar inte emot så stora filer. Prova en mindre eller dela en länk."], "429": ["Ta det lite lugnare", "Du har gjort många förfrågningar på kort tid. Vänta en minut eller två och försök igen."], "451": ["Inte tillgängligt i din region", "Lareon är inte tillgängligt där du ansluter ifrån. Tror du att det är ett misstag, hör av dig."], "500": ["Något gick sönder hos oss", "Det är vårt fel, inte ditt. Det har loggats. Försök igen om en stund, och hör av dig om det fortsätter."], "502": ["Vi når inte servern", "Lareon har problem just nu. Det brukar lösa sig inom några minuter."], "503": ["Vi är strax tillbaka", "Lareon är nere för en snabb uppdatering eller har hög belastning. Din e-post och dina data är säkra."], "504": ["Det tog för lång tid", "Servern svarade inte i tid. Försök igen om en stund."]}, "ko": {"ui": {"retry": "다시 시도", "home": "Lareon으로 돌아가기", "help": "도움 받기", "signin": "로그인", "auto": "이 페이지는 30초마다 자동으로 다시 확인합니다."}, "offline": ["{a}에 연결할 수 없습니다", "인터넷 연결을 확인하세요. 잃어버린 것은 없으며, 다시 시도하면 앱이 하던 곳에서 이어집니다."], "400": ["요청이 처리되지 않았습니다", "요청에 문제가 있었습니다. 돌아가서 다시 시도하거나 홈에서 처음부터 시작하세요."], "401": ["계속하려면 로그인하세요", "이 페이지를 열려면 로그인해야 합니다. Lareon 계정으로 로그인한 뒤 다시 시도하세요."], "403": ["열 수 없습니다", "이 페이지에 접근할 권한이 없습니다. 오류라고 생각되면 알려 주세요."], "404": ["페이지를 찾을 수 없습니다", "페이지가 없거나 이동되었습니다. 주소를 확인하거나 돌아가세요."], "405": ["여기서는 허용되지 않습니다", "이 주소는 그 방식으로 열 수 없습니다. 돌아가서 처음부터 시도하세요."], "408": ["요청 시간이 초과되었습니다", "요청을 제때 받지 못했습니다. 연결을 확인하고 다시 시도하세요."], "410": ["더 이상 사용할 수 없는 링크입니다", "만료되었거나, 이미 사용되었거나, 삭제되었을 수 있습니다. 보안을 위해 이런 링크는 일정 시간이 지나면 작동하지 않습니다."], "413": ["파일이 너무 큽니다", "Fledge는 이렇게 큰 파일을 받을 수 없습니다. 더 작은 파일을 쓰거나 링크를 공유하세요."], "429": ["조금만 천천히 해 주세요", "짧은 시간에 요청이 너무 많았습니다. 1~2분 기다린 뒤 다시 시도하세요."], "451": ["사용 중인 지역에서는 이용할 수 없습니다", "지금 접속하신 곳에서는 Lareon을 이용할 수 없습니다. 오류라고 생각되면 알려 주세요."], "500": ["저희 쪽에 문제가 생겼습니다", "저희 잘못이며 이미 기록되었습니다. 잠시 후 다시 시도하세요. 계속되면 알려 주세요."], "502": ["서버에 연결할 수 없습니다", "지금 Lareon에 문제가 있습니다. 보통 몇 분 안에 해결됩니다."], "503": ["곧 돌아오겠습니다", "Lareon이 빠른 업데이트 중이거나 매우 혼잡합니다. 메일과 데이터는 안전합니다."], "504": ["시간이 너무 오래 걸렸습니다", "서버가 제때 응답하지 않았습니다. 잠시 후 다시 시도하세요."]}, "zh": {"ui": {"retry": "重试", "home": "返回 Lareon", "help": "获取帮助", "signin": "登录", "auto": "本页面每 30 秒会自动重新检查。"}, "offline": ["{a} 无法连接", "请检查你的网络连接。不会丢失任何内容，重试后应用会从你离开的地方继续。"], "400": ["该请求未成功", "请求有些问题。请返回重试，或从主页重新开始。"], "401": ["请登录以继续", "需要登录才能打开此内容。请使用你的 Lareon 账号登录后重试。"], "403": ["你无法打开此内容", "你没有权限访问此页面。如果你认为这是错误，请告诉我们。"], "404": ["找不到页面", "该页面不存在或已移动。请检查地址，或返回查找

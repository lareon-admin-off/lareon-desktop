<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lareon</title>
<link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="vendor/katex/katex.min.css"><link rel="stylesheet" href="md.css"><script src="theme.js"></script>
<style>
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(120% 90% at 0% 0%,rgba(163,92,245,.16),transparent 55%),radial-gradient(90% 80% at 100% 0%,rgba(255,124,31,.13),transparent 50%),var(--solid);display:flex;flex-direction:column;padding:0 20px;-webkit-app-region:drag;position:relative}
body:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--grad)}
.q{display:flex;align-items:center;gap:14px;min-height:88px;-webkit-app-region:no-drag}
.q .lg{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--hover);box-shadow:inset 0 0 0 1px var(--line),0 6px 22px rgba(217,79,196,.22)}
.q .lg img{width:28px;height:28px}
input{flex:1;min-width:0;font:inherit;font-size:20px;font-weight:500;letter-spacing:-.01em;color:var(--fg);background:none;border:0;outline:0;padding:10px 0;-webkit-user-select:text;user-select:text}
input::placeholder{color:var(--fg3);font-weight:400}input:focus{box-shadow:none;border:0;outline:0}
.k{flex:none;font-size:11px;color:var(--fg3);border:1px solid var(--line2);border-radius:6px;padding:2px 7px;font-family:ui-monospace,Menlo,Consolas,monospace}
#a{flex:1;overflow:auto;margin:2px 0 4px;padding:16px 18px;border-radius:14px;background:var(--hover);box-shadow:inset 0 0 0 1px var(--line);-webkit-user-select:text;user-select:text;-webkit-app-region:no-drag;animation:in .28s ease both}
#a[hidden]{display:none}#a.dim{color:var(--fg3);display:flex;align-items:center;gap:10px}
#a.dim:before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);border-top-color:#d94fc4;animation:sp .8s linear infinite;flex:none}
#a.dim.err:before{display:none}
#a .katex-display{background:rgba(127,127,127,.08);border-radius:10px;padding:10px 12px;margin:.6em 0}
.f{display:flex;align-items:center;justify-content:space-between;padding:10px 0 14px;-webkit-app-region:no-drag}.f[hidden]{display:none}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){#a,#a.dim:before{animation:none}}
</style></head><body>
<div class="q"><div class="lg"><img src="../build/art/aster-logo.svg" alt=""></div><input id="i" maxlength="1000" autocomplete="off" data-ip="ask.ph"><span class="k">Esc</span></div>
<div id="a" class="md" hidden></div>
<div class="f" id="f" hidden><span class="k">↵</span><button class="btn pri" id="go" data-i="ask.open" style="border:0;border-radius:9px;padding:7px 14px;font-size:13px;color:#fff;background:var(--grad)"></button></div>
<script src="vendor/katex/katex.min.js"></script><script src="md.js"></script><script src="i18n-more.js"></script><script src="i18n.js"></script>
<script>
var $=function(i){return document.getElementById(i)},t=function(k,v){return i18n.t(k,v)},busy=false;
lareon.info().then(function(r){i18n.set(r.lang||i18n.guess(r.locale),true)});
function fit(){lareon.askResize($('a').hidden?120:Math.min(560,84+$('a').scrollHeight+70))}
function reset(){$('i').value='';$('a').hidden=true;$('f').hidden=true;busy=false;lareon.askResize(120);$('i').focus()}
lareon.onShowAsk(reset);
$('go').onclick=function(){lareon.askContinue()};
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'){lareon.askClose();return}
 if(e.key!=='Enter'||busy)return;var v=$('i').value.trim();if(!v)return;busy=true;
 $('a').hidden=false;$('a').className='md dim';$('a').textContent=t('ask.thinking');fit();
 lareon.askAster(v,[]).then(function(r){
  busy=false;
  if(r&&r.ok){$('a').className='md';$('a').innerHTML=window.mdRender(r.text);$('f').hidden=false}
  else{$('a').className='md dim err';$('a').textContent=r&&r.code==='net'?t('err.net'):r&&r.error==='signin'?t('sess'):(r&&r.error)||t('net.fail');$('f').hidden=true}
  fit();
 });
});
setTimeout(function(){$('i').focus()},50);
</script></body></html>

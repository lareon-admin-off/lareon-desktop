<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Aster is using your computer</title>
<link rel="stylesheet" href="theme.css"><script src="theme.js"></script>
<style>
html,body{height:100%;margin:0;overflow:hidden;background:transparent!important}
body{position:relative;text-shadow:none!important}
/* a soft glow around the screen edge while Aster is in control */
.edge{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 0 3px rgba(180,124,255,.75),inset 0 0 48px rgba(255,138,51,.28);border-radius:10px;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:inset 0 0 0 3px rgba(255,138,51,.8),inset 0 0 64px rgba(180,124,255,.3)}}
/* Aster's cursor */
#cur{position:fixed;left:0;top:0;width:0;height:0;transition:transform .55s cubic-bezier(.22,1,.36,1);will-change:transform;pointer-events:none;z-index:5}
#cur svg{position:absolute;left:-3px;top:-2px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.45))}
#cur .lab{position:absolute;left:22px;top:22px;white-space:nowrap;font:600 12px/1 var(--sans);color:#fff;background:linear-gradient(135deg,#ff8a33,#c26bff);padding:6px 10px;border-radius:999px;box-shadow:0 6px 18px -6px rgba(0,0,0,.5);max-width:340px;overflow:hidden;text-overflow:ellipsis}
#cur .ring{position:absolute;left:-18px;top:-18px;width:36px;height:36px;border-radius:50%;border:2px solid #ff8a33;opacity:0}
#cur.click .ring{animation:ring .5s ease-out}
@keyframes ring{from{opacity:1;transform:scale(.3)}to{opacity:0;transform:scale(1.4)}}
#cur.hide{opacity:0}
/* the pill: what Aster is doing, and Stop */
#pill{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:8px 8px 8px 14px;max-width:min(680px,90vw);
 background:rgba(20,17,30,.92);color:#fff;border:1px solid rgba(255,255,255,.14);border-radius:999px;box-shadow:0 18px 40px -16px rgba(0,0,0,.6);backdrop-filter:blur(16px);font:500 13px/1.3 var(--sans);animation:drop .4s cubic-bezier(.22,1,.36,1) both;z-index:6}
@keyframes drop{from{opacity:0;transform:translate(-50%,-14px)}}
#pill img{width:20px;height:20px;flex:none}
#pill .t{display:flex;flex-direction:column;min-width:0}
#pill b{font-weight:700;font-size:12px;color:#ffb27a}
#pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#e9e6f5}
#pill .n{font:500 11px var(--mono);color:#a9a4c0;flex:none}
#stop{flex:none;font:600 13px var(--sans);color:#fff;background:#e0324f;border:0;border-radius:999px;padding:7px 14px;cursor:pointer}
#stop:hover{background:#ff4563}
</style></head><body>
<div class="edge"></div>
<div id="pill"><img src="../build/art/aster-logo.svg" alt=""><div class="t"><b>Aster is using your computer</b><span id="say">Looking at your screen…</span></div><span class="n" id="n"></span><button id="stop" title="Stop (Esc)">Stop</button></div>
<div id="cur" class="hide"><div class="ring"></div><svg width="26" height="30" viewBox="0 0 26 30"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb066"/><stop offset=".55" stop-color="#ff6fa0"/><stop offset="1" stop-color="#b47cff"/></linearGradient></defs><path d="M3 2 L3 24 L9 18.5 L13.2 27.5 L17 25.8 L12.9 17 L21 17 Z" fill="url(#g)" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg><div class="lab" id="lab">Aster</div></div>
<script>
var $=function(i){return document.getElementById(i)};
lareon.onAgent(function(v){
 if(v.say!=null)$('say').textContent=v.say;
 if(v.n!=null)$('n').textContent=v.n?('step '+v.n):'';
 if(v.x!=null){var c=$('cur');c.classList.remove('hide');c.style.transform='translate('+v.x+'px,'+v.y+'px)';$('lab').textContent=v.label||'Aster'}
 if(v.click){var c2=$('cur');c2.classList.remove('click');void c2.offsetWidth;c2.classList.add('click')}
});
var p=$('pill');p.onmouseenter=function(){lareon.agentHover(true)};p.onmouseleave=function(){lareon.agentHover(false)};
$('stop').onclick=function(){lareon.agentStop()};
</script></body></html>
